name: Windows release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build-windows.txt

      - name: Download official model files
        shell: pwsh
        run: python dev/fetch_models.py  # pinned commits, SHA-256 checked

      - name: Run tests
        shell: pwsh
        run: |
          $env:NEEDLE3_LIB_PATH = (Resolve-Path "vendor\windows\libneedle.dll").Path
          python -m unittest discover tests -v

  build-windows:
    needs: test-windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-build-windows.txt

      - name: Download official model files
        shell: pwsh
        run: python dev/fetch_models.py  # pinned commits, SHA-256 checked

      - name: Warm and verify the native Needle engine
        shell: pwsh
        run: |
          $env:NEEDLE3_LIB_PATH = (Resolve-Path "vendor\windows\libneedle.dll").Path
          python -m unittest tests.test_offline -v

      - name: Build Windows distribution
        shell: pwsh
        run: .\build.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Grain-Windows-${{ github.sha }}
          path: |
            dist/Grain/
            dist/Grain Setup *.exe
          if-no-files-found: error
          retention-days: 14
